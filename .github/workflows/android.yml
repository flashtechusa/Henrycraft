name: Build Henrycraft APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'index.html'
      - 'tools/check.sh'
      - 'tools/test-game.js'
      - 'tools/test-districts.js'
      - 'tools/test-portals.js'
      - 'tools/test-offline.js'
      - '.github/workflows/android.yml'
  # Publishing a Release triggers a build too. GitHub applies the paths filter
  # above to tag pushes as well, so a v* tag on a commit that touched nothing in
  # that list would not build on its own; going through a Release, or using Run
  # workflow below, always works.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the APK to a Release

jobs:
  # Runs alongside the APK build, so it costs no extra wall clock.
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright with Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Run the game tests
        run: |
          set +e
          node tools/test-game.js | tee /tmp/game.txt
          rc=${PIPESTATUS[0]}
          {
            echo '## Game tests'
            echo ''
            echo '```'
            cat /tmp/game.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Run the portal tests
        run: |
          set +e
          node tools/test-portals.js | tee /tmp/portals.txt
          rc=${PIPESTATUS[0]}
          { echo '## Portal tests'; echo ''; echo '```'; cat /tmp/portals.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Run the offline-safety tests
        run: |
          set +e
          node tools/test-offline.js | tee /tmp/offline.txt
          rc=${PIPESTATUS[0]}
          { echo '## Offline safety'; echo ''; echo '```'; cat /tmp/offline.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Run the district tests
        run: |
          set +e
          node tools/test-districts.js | tee /tmp/districts.txt
          rc=${PIPESTATUS[0]}
          {
            echo '## District tests'
            echo ''
            echo '```'
            cat /tmp/districts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  build:
    runs-on: ubuntu-latest        # the Android SDK is preinstalled here

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x android/gradlew

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run the verification checks
        run: |
          set +e
          bash tools/check.sh | tee /tmp/checks.txt
          rc=${PIPESTATUS[0]}
          {
            echo '## Verification checks'
            echo ''
            echo '```'
            cat /tmp/checks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$src" || { echo "::error::no APK at $src"; exit 1; }
          mkdir -p dist
          cp "$src" dist/henrycraft.apk
          echo "path=dist/henrycraft.apk" >> "$GITHUB_OUTPUT"
          ls -l dist/henrycraft.apk

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: henrycraft-apk
          path: dist/henrycraft.apk
          if-no-files-found: error

      # Attach to the Release so it can be downloaded straight onto the tablet
      # from the Releases page in Silk.
      - name: Attach the APK to the Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Henrycraft $tag" --notes "Sideload henrycraft.apk on a Fire tablet. No network or permissions needed."
          fi
          gh release upload "$tag" dist/henrycraft.apk --clobber
