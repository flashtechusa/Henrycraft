<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henrycraft</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #6ec0ff;
    color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    text-align: center;
  }
  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 4rem;
  }
  h1 {
    margin: 0 0 .25rem;
    font-size: clamp(2.25rem, 11vw, 4rem);
    letter-spacing: .12em;
    text-shadow: 4px 4px 0 #2f6f2f;
  }
  .sub {
    margin: 0 0 2.5rem;
    letter-spacing: .18em;
    font-size: .9rem;
    opacity: .9;
  }
  .card {
    background: rgba(0, 0, 0, .28);
    border: 4px solid rgba(255, 255, 255, .35);
    border-radius: 10px;
    padding: 1.5rem 1.25rem;
    line-height: 1.6;
  }
  .card p { margin: 0 0 1rem; }
  .card p:last-child { margin-bottom: 0; }
  .dirt {
    height: 3rem;
    background:
      repeating-linear-gradient(90deg, #7a4f2a 0 2rem, #6b4524 2rem 4rem);
    border-top: .75rem solid #4f8f3f;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>HENRYCRAFT</h1>
    <p class="sub">HENRY'S BLOCKY WORLD</p>
    <div class="card">
      <p>&#127959; The world is still being built.</p>
      <p>This page is live and the hosting is working &mdash; the game itself
         is on its way. Check back in a bit!</p>
    </div>
  </div>
  <div class="dirt"></div>
</body>
</html>
